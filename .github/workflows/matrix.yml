name: OIDC environment subject encoding matrix

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        environment_name:
          - 'Production:V1'
          - 'Production%3AV1'
          - 'Production%253AV1'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment_name }}
    steps:
      - name: Request and inspect identity
        env:
          OIDC_AUDIENCE: h1-oidc-environment-collision
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(jq -r '.value' <<<"$response")"
          payload="$(python3 -c 'import base64,sys; p=sys.argv[1].split(".")[1]; print(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)).decode())' "$token")"
          jq -c '{iss,aud,sub,environment,environment_node_id,repository,repository_id,ref,workflow_ref}' \
            <<<"$payload"
